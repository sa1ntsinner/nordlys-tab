# A v* tag is a release: the Chrome, Edge and Firefox packages are built and
# sent to their stores (tools/release/publish.cjs), and a GitHub release is
# made with the zips. The Safari app goes up from safari.yml on the same tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The version in the tag is the version in the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p 'require("./manifest.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, manifest $version"; exit 1; }
      - run: npm run lint && npm run test:unit
      - run: npm run ports
      - name: Send to the stores
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node tools/release/publish.cjs
      - name: GitHub release with the packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(node -e 'const s=require("fs").readFileSync("CHANGELOG.md","utf8");const v=require("./manifest.json").version;const m=s.split(/\n## /).find(p=>p.startsWith("["+v+"]"));console.log(m?m.split("\n").slice(1).join("\n").trim():"")')
          gh release create "$GITHUB_REF_NAME" nordlys-*-v*.zip --title "Nordlys ${GITHUB_REF_NAME#v}" --notes "$notes" || gh release upload "$GITHUB_REF_NAME" nordlys-*-v*.zip --clobber
